name: Docker Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t traceroot-backend:test backend
      - run: docker build -t traceroot-frontend:test frontend
